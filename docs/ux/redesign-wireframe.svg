<svg xmlns="http://www.w3.org/2000/svg" width="1485" height="760" viewBox="0 0 1485 760" role="img" aria-labelledby="title desc">
  <title id="title">LAN Audio Sender Android redesign wireframes</title>
  <desc id="desc">Four portrait wireframes show Connect, Choose a Mac, Sending, and iMac output management available only when the receiver supports it.</desc>
  <rect width="1485" height="760" fill="#eef0f4"/>
  <style>
    .phone{fill:#f8f9fc;stroke:#aeb4bf;stroke-width:2}.card{fill:#fff;stroke:#dadce5;stroke-width:1.5}.txt{font:16px Arial,sans-serif;fill:#1c1e22}.small{font:13px Arial,sans-serif;fill:#4f5662}.title{font:bold 22px Arial,sans-serif;fill:#1c1e22}.h{font:bold 16px Arial,sans-serif;fill:#1c1e22}.btn{fill:#285fb4}.btnTxt{font:bold 15px Arial,sans-serif;fill:#fff}.outline{fill:none;stroke:#285fb4;stroke-width:2}
  </style>
  <g transform="translate(35 35)">
    <text x="0" y="0" class="h">1 · Connect</text>
    <rect x="0" y="18" width="320" height="690" rx="28" class="phone"/>
    <text x="22" y="62" class="title">LAN Audio</text>
    <rect x="18" y="82" width="284" height="104" rx="16" class="card"/>
    <text x="34" y="111" class="small">CONNECTED MAC</text><text x="34" y="140" class="h">iMac Studio · Paired</text><text x="34" y="165" class="small">Available on this network</text><text x="246" y="140" class="small">Change</text>
    <rect x="18" y="202" width="284" height="140" rx="16" class="card"/>
    <text x="34" y="231" class="h">Audio source</text><text x="34" y="264" class="txt">◉ All compatible apps</text><text x="34" y="296" class="txt">○ One app</text><text x="34" y="324" class="small">Choose an app…</text>
    <text x="22" y="374" class="small">ⓘ Copies eligible audio; does not mute</text><text x="22" y="394" class="small">the app on this phone. Some apps may</text><text x="22" y="414" class="small">block capture and send silence.</text>
    <rect x="18" y="432" width="284" height="66" rx="12" fill="#fff7e8" stroke="#dec99f"/><text x="34" y="459" class="small">⚠ Trusted network only.</text><text x="34" y="480" class="small">Audio and pairing details are unencrypted.</text>
    <rect x="18" y="620" width="284" height="56" rx="12" class="btn"/><text x="91" y="655" class="btnTxt">Start sending</text>
  </g>
  <g transform="translate(400 35)">
    <text x="0" y="0" class="h">2 · Choose Mac</text>
    <rect x="0" y="18" width="320" height="690" rx="28" class="phone"/>
    <text x="22" y="62" class="title">Choose a Mac</text>
    <rect x="18" y="82" width="284" height="44" rx="12" class="card"/><text x="34" y="110" class="small">Nearby     Scan QR     Enter IP</text>
    <text x="22" y="158" class="h">On this network</text>
    <rect x="18" y="174" width="284" height="82" rx="14" class="outline"/><text x="34" y="207" class="h">✓ iMac Studio</text><text x="34" y="235" class="small">Available · 192.168.1.42 · Paired</text>
    <rect x="18" y="266" width="284" height="82" rx="14" class="card"/><text x="34" y="299" class="h">MacBook Pro</text><text x="34" y="327" class="small">Searching… · Not paired</text>
    <text x="22" y="383" class="small">Discovery can’t find your Mac?</text>
    <rect x="18" y="400" width="284" height="84" rx="14" class="card"/><text x="34" y="432" class="h">Enter private IP</text><text x="34" y="461" class="small">192.168.1.42      Port 50555</text>
    <rect x="18" y="620" width="284" height="56" rx="12" class="btn"/><text x="101" y="655" class="btnTxt">Use this Mac</text>
  </g>
  <g transform="translate(765 35)">
    <text x="0" y="0" class="h">3 · Sending</text>
    <rect x="0" y="18" width="320" height="690" rx="28" class="phone"/>
    <text x="22" y="62" class="title">Sending</text>
    <rect x="18" y="82" width="284" height="98" rx="16" class="card"/>
    <text x="34" y="114" class="small">CONNECTED TO</text><text x="34" y="144" class="h">iMac Studio</text><text x="34" y="168" class="small">Spotify · Sending audio</text>
    <rect x="18" y="198" width="284" height="190" rx="16" class="card"/>
    <text x="34" y="230" class="h">iMac output volume</text><text x="34" y="275" class="small">−</text><rect x="57" y="262" width="180" height="8" rx="4" fill="#d1d6df"/><rect x="57" y="262" width="120" height="8" rx="4" fill="#285fb4"/><circle cx="177" cy="266" r="11" fill="#285fb4"/><text x="248" y="275" class="txt">67%</text><text x="34" y="320" class="small">Volume confirmed by Mac</text><text x="34" y="365" class="h">Mute</text>
    <rect x="18" y="620" width="284" height="56" rx="12" fill="#b3261e"/><text x="104" y="655" class="btnTxt">Stop sending</text>
  </g>
  <g transform="translate(1130 35)">
    <text x="0" y="0" class="h">4 · Manage iMac output (if supported)</text>
    <rect x="0" y="18" width="320" height="690" rx="28" class="phone"/>
    <text x="22" y="62" class="title">iMac audio output</text>
    <rect x="18" y="82" width="284" height="94" rx="16" class="card"/>
    <text x="34" y="111" class="small">CURRENT OUTPUT · IN USE</text><text x="34" y="141" class="h">Built-in Output</text><text x="34" y="163" class="small">Connected</text>
    <text x="22" y="211" class="h">Available outputs</text>
    <rect x="18" y="226" width="284" height="66" rx="14" class="outline"/><text x="34" y="253" class="h">✓ Built-in Output</text><text x="34" y="277" class="small">In use</text>
    <rect x="18" y="302" width="284" height="66" rx="14" class="card"/><text x="34" y="342" class="txt">Headphones</text>
    <rect x="18" y="382" width="284" height="108" rx="16" class="card"/><text x="34" y="411" class="h">iMac output volume</text><rect x="34" y="439" width="190" height="8" rx="4" fill="#d1d6df"/><rect x="34" y="439" width="130" height="8" rx="4" fill="#285fb4"/><circle cx="164" cy="443" r="10" fill="#285fb4"/><text x="238" y="449" class="txt">67%</text><text x="34" y="474" class="small">Confirmed by Mac</text>
    <rect x="18" y="504" width="284" height="98" rx="14" fill="#fff7e8" stroke="#dec99f"/><text x="34" y="532" class="h">Bluetooth on your Mac</text><text x="34" y="557" class="small">Pair or remove devices in System</text><text x="34" y="578" class="small">Settings › Bluetooth on the Mac.</text><text x="34" y="597" class="small">No remote pairing controls.</text>
    <text x="22" y="642" class="small">Only render output controls when the</text><text x="22" y="663" class="small">receiver confirms protocol support.</text>
  </g>
</svg>
