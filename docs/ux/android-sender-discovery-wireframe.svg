<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1000" viewBox="0 0 1320 1000">
<defs><style>text{font-family:Arial,sans-serif;fill:#202124}.tiny{font-size:12px}.small{font-size:14px}.body{font-size:16px}.title{font-size:24px;font-weight:700}.bold{font-weight:700}.muted{fill:#5f6368}.white{fill:#fff}.card{fill:#fff;stroke:#dadce0;stroke-width:1}</style></defs>
<rect width="1320" height="1000" fill="#e9edf2"/>
<text x="38" y="48" font-size="24" font-weight="700">LAN Audio Sender · Bonjour receiver discovery</text><text x="38" y="74" class="small muted">Native Android portrait wireframe · same trusted LAN · audio and PIN unencrypted · PIN remains manual</text>
<!-- available -->
<g transform="translate(38 108)"><text x="0" y="-8" class="small bold">A · Receiver available and selected</text><rect width="392" height="850" rx="30" fill="#F8F9FC" stroke="#aab4c0" stroke-width="2"/>
<text x="22" y="30" class="tiny muted">9:41</text><text x="24" y="76" class="title">Send audio to iMac</text>
<rect x="20" y="96" width="352" height="72" rx="14" fill="#fff4df" stroke="#eed49e"/><text x="36" y="122" class="small bold">Trusted network only</text><text x="36" y="145" class="small">Audio and PIN are not encrypted.</text>
<text x="22" y="204" class="body bold">Receivers on this network</text><text x="330" y="204" class="tiny" fill="#1769aa">Scan again</text>
<rect x="20" y="218" width="352" height="92" rx="14" fill="#eaf3ff" stroke="#4285f4" stroke-width="2"/><circle cx="48" cy="264" r="16" fill="#d5e7ff"/><text x="42" y="269" class="small">⌘</text><text x="76" y="249" class="body bold">iMac Studio</text><text x="76" y="275" class="small muted">192.168.1.42 · Port 50555</text><circle cx="344" cy="264" r="11" fill="#1769aa"/><path d="M338 264l4 4 8-9" fill="none" stroke="#fff" stroke-width="2"/>
<text x="22" y="336" class="tiny" fill="#1769aa">Selected · 192.168.1.42:50555 copied to address</text>
<line x1="22" y1="365" x2="155" y2="365" stroke="#c5ccd4"/><text x="169" y="370" class="tiny muted">OR ENTER IP MANUALLY</text><line x1="237" y1="365" x2="370" y2="365" stroke="#c5ccd4"/>
<text x="22" y="398" class="tiny muted">iMac private IP address</text><rect x="20" y="405" width="270" height="56" rx="7" fill="#fff" stroke="#737980"/><text x="36" y="440" class="body">192.168.1.42</text><rect x="298" y="405" width="74" height="56" rx="10" fill="#e8eaed"/><text x="310" y="439" class="small bold">:50555</text>
<text x="22" y="489" class="tiny muted">6-digit pairing code</text><rect x="20" y="496" width="352" height="56" rx="7" fill="#fff" stroke="#737980"/><text x="36" y="531" class="body">● ● ● ● ● ●</text><text x="348" y="531" class="small muted">◉</text>
<text x="24" y="581" class="small">Android requires microphone permission for playback</text><text x="24" y="601" class="small">capture; this app does not record microphone audio.</text>
<rect x="20" y="619" width="352" height="50" rx="12" fill="#edf1f5"/><text x="34" y="650" class="small">Status: Stopped</text>
<rect x="20" y="685" width="352" height="58" rx="8" fill="#1769aa"/><text x="136" y="721" class="body white bold">Start sending</text><rect x="20" y="755" width="352" height="56" rx="8" fill="#e8eaed"/><text x="173" y="790" class="body bold">Stop</text>
<text x="24" y="830" class="tiny muted">Some apps/DRM may block capture and send silence.</text></g>
<!-- resolving -->
<g transform="translate(464 108)"><text x="0" y="-8" class="small bold">B · Resolving state</text><rect width="392" height="850" rx="30" fill="#F8F9FC" stroke="#aab4c0" stroke-width="2"/>
<text x="22" y="30" class="tiny muted">9:41</text><text x="24" y="76" class="title">Send audio to iMac</text><rect x="20" y="96" width="352" height="62" rx="14" fill="#fff4df"/><text x="36" y="122" class="small bold">Trusted network only</text><text x="36" y="143" class="tiny">Audio and PIN are not encrypted.</text>
<text x="22" y="196" class="body bold">Receivers on this network</text><text x="330" y="196" class="tiny" fill="#1769aa">Scan again</text>
<rect x="20" y="211" width="352" height="82" rx="14" fill="#fff" stroke="#dadce0"/><circle cx="48" cy="252" r="16" fill="#e8eaed"/><text x="42" y="257" class="small">⌘</text><text x="76" y="244" class="body bold">iMac Studio</text><text x="76" y="269" class="small muted">Resolving…</text><circle cx="344" cy="252" r="9" fill="none" stroke="#4285f4" stroke-width="3" stroke-dasharray="20 12"/>
<text x="22" y="326" class="small muted">Manual IP and PIN are still available</text><line x1="22" y1="356" x2="150" y2="356" stroke="#c5ccd4"/><text x="162" y="361" class="tiny muted">OR ENTER IP MANUALLY</text>
<text x="22" y="392" class="tiny muted">iMac private IP address</text><rect x="20" y="399" width="270" height="56" rx="7" fill="#fff" stroke="#737980"/><text x="36" y="434" class="small muted">192.168.1.___</text><rect x="298" y="399" width="74" height="56" rx="10" fill="#e8eaed"/><text x="310" y="433" class="small bold">:50555</text>
<text x="22" y="481" class="tiny muted">6-digit pairing code</text><rect x="20" y="488" width="352" height="56" rx="7" fill="#fff" stroke="#737980"/><text x="36" y="523" class="body muted">Enter code</text>
<rect x="20" y="610" width="352" height="50" rx="12" fill="#edf1f5"/><text x="34" y="641" class="small">Status: Stopped</text><rect x="20" y="676" width="352" height="58" rx="8" fill="#aeb8c2"/><text x="136" y="712" class="body white bold">Start sending</text><rect x="20" y="746" width="352" height="56" rx="8" fill="#e8eaed"/><text x="173" y="781" class="body bold">Stop</text><text x="24" y="830" class="tiny muted">Start disabled until IP and six-digit code are valid.</text></g>
<!-- empty/error -->
<g transform="translate(890 108)"><text x="0" y="-8" class="small bold">C · Empty / discovery error</text><rect width="392" height="850" rx="30" fill="#F8F9FC" stroke="#aab4c0" stroke-width="2"/>
<text x="22" y="30" class="tiny muted">9:41</text><text x="24" y="76" class="title">Send audio to iMac</text><rect x="20" y="96" width="352" height="62" rx="14" fill="#fff4df"/><text x="36" y="122" class="small bold">Trusted network only</text><text x="36" y="143" class="tiny">Audio and PIN are not encrypted.</text>
<text x="22" y="196" class="body bold">Receivers on this network</text><rect x="20" y="210" width="352" height="138" rx="14" fill="#fff" stroke="#dadce0"/><circle cx="196" cy="241" r="17" fill="#e8eaed"/><text x="187" y="247" class="body">⌕</text><text x="87" y="277" class="body bold">No compatible receiver found</text><text x="47" y="301" class="tiny muted">Check the iMac is running on the same trusted</text><text x="95" y="319" class="tiny muted">Wi-Fi/LAN, or enter its private IP below.</text><rect x="122" y="326" width="148" height="1" fill="#dadce0"/>
<rect x="20" y="359" width="352" height="46" rx="8" fill="#e8f0fe"/><text x="143" y="388" class="small bold" fill="#1769aa">Scan again</text>
<line x1="22" y1="429" x2="150" y2="429" stroke="#c5ccd4"/><text x="162" y="434" class="tiny muted">OR ENTER IP MANUALLY</text>
<text x="22" y="467" class="tiny muted">iMac private IP address</text><rect x="20" y="474" width="270" height="56" rx="7" fill="#fff" stroke="#737980"/><text x="36" y="509" class="body">192.168.1.42</text><rect x="298" y="474" width="74" height="56" rx="10" fill="#e8eaed"/><text x="310" y="508" class="small bold">:50555</text>
<text x="22" y="556" class="tiny muted">6-digit pairing code</text><rect x="20" y="563" width="352" height="56" rx="7" fill="#fff" stroke="#737980"/><text x="36" y="598" class="body">● ● ● ● ● ●</text>
<rect x="20" y="665" width="352" height="50" rx="12" fill="#edf1f5"/><text x="34" y="696" class="small">Status: Stopped</text><rect x="20" y="731" width="352" height="58" rx="8" fill="#1769aa"/><text x="136" y="767" class="body white bold">Start sending</text><text x="24" y="823" class="tiny muted">Discovery error: “Couldn’t search for receivers.”</text><text x="24" y="839" class="tiny muted">Try again or continue with manual IP.</text></g>
<text x="40" y="985" class="tiny muted">Selection only fills IP + fixed port 50555. PIN stays manual. Discovery never auto-starts a capture session.</text>
</svg>
